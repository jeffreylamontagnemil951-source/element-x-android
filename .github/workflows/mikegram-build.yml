name: MIKE GRAM Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - "mikegram/**"

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -Dkotlin.daemon.jvm.options=-Xmx4g

jobs:
  debug-apk:
    name: Build MIKE GRAM debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Android build environment
        uses: ./.github/actions/setup-build
        with:
          free-disk-space: 'true'

      - name: Assemble debug APKs
        run: ./gradlew :app:assembleGplayDebug :app:assembleFdroidDebug -PallWarningsAsErrors=true --stacktrace -Dsonar.gradle.skipCompile=true --no-configuration-cache

      - name: Upload MIKE GRAM APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mikegram-debug
          if-no-files-found: error
          path: |
            app/build/outputs/apk/gplay/debug/*-universal-debug.apk
            app/build/outputs/apk/fdroid/debug/*-universal-debug.apk
