name = "mikegram-api-gateway"
main = "src/index.ts"
compatibility_date = "2026-11-04"
workers_dev = true

[vars]
CORS_ORIGIN = "https://mikegram.example"

[[d1_databases]]
binding = "DB"
database_name = "mikegram-core"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"
migrations_dir = "migrations"
